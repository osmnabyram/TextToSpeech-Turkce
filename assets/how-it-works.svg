<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Audio is captured from the microphone, transcribed locally by Whisper, and typed into the active window; no data goes to the internet.">
  <style>
    :root{
      --ink:#1b1b1f; --muted:#6b7280; --line:#c7cad1;
      --accent:#e53935; --accentdim:#ff5252; --panel:#f3f0f1; --panelln:#e0b9bb;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --ink:#e8e8ea; --muted:#9aa0a6; --line:#3a3d44;
        --accent:#e53935; --accentdim:#ff6b6b; --panel:#1c1416; --panelln:#7f1d1d;
      }
    }
    .ink{fill:var(--ink)} .muted{fill:var(--muted)}
    .ln{stroke:var(--line);stroke-width:2;fill:none}
    .acc{fill:var(--accent)} .accs{stroke:var(--accent)}
    .title{font-size:13px;font-weight:600;letter-spacing:.3px}
    .lbl{font-size:13px;font-weight:600}
    .sub{font-size:10.5px}

    .bar{fill:var(--accent);transform-box:fill-box;transform-origin:center bottom;
         animation:bar 1.1s ease-in-out infinite alternate}
    @keyframes bar{from{transform:scaleY(.25)}to{transform:scaleY(1)}}

    .indot{animation:indot 4s linear infinite}
    @keyframes indot{
      0%{transform:translateX(0);opacity:0} 6%{opacity:1}
      24%{transform:translateX(118px);opacity:1} 28%{transform:translateX(118px);opacity:0}
      100%{transform:translateX(118px);opacity:0}}

    .chipglow{animation:glow 4s ease-in-out infinite}
    @keyframes glow{0%,24%{opacity:0} 34%{opacity:1} 54%{opacity:1} 64%,100%{opacity:0}}

    .outdot{animation:outdot 4s linear infinite}
    @keyframes outdot{
      0%,56%{transform:translateX(0);opacity:0} 61%{opacity:1}
      80%{transform:translateX(120px);opacity:1} 85%{opacity:0} 100%{opacity:0}}

    .caret{animation:blink 1.05s steps(1) infinite}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

    .typed{clip-path:inset(0 100% 0 0);animation:type 4s ease-in-out infinite}
    @keyframes type{0%,62%{clip-path:inset(0 100% 0 0)}
      86%{clip-path:inset(0 0 0 0)}97%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}

    .blockdot{animation:block 4s ease-in infinite}
    @keyframes block{0%,30%{transform:translateY(0);opacity:0}
      35%{opacity:1}46%{transform:translateY(-34px);opacity:1}
      52%{transform:translateY(-34px);opacity:0}100%{opacity:0}}
    .xmark{animation:xflash 4s ease infinite}
    @keyframes xflash{0%,46%{opacity:0}53%{opacity:1}66%{opacity:1}76%,100%{opacity:0}}
  </style>

  <text x="410" y="26" text-anchor="middle" class="title muted">Your voice never leaves your computer — how it works</text>

  <!-- connectors -->
  <line x1="196" y1="150" x2="322" y2="150" class="ln"/>
  <line x1="480" y1="150" x2="610" y2="150" class="ln"/>
  <polygon points="322,150 312,145 312,155" class="muted" fill="currentColor"/>
  <polygon points="610,150 600,145 600,155" class="muted" fill="currentColor"/>

  <!-- Stage 1: microphone -->
  <g transform="translate(70,120)">
    <rect x="12" y="0" width="26" height="42" rx="13" class="accs" fill="none" stroke-width="2.5"/>
    <path d="M4 30 a21 21 0 0 0 42 0" class="accs" fill="none" stroke-width="2.5"/>
    <line x1="25" y1="51" x2="25" y2="64" class="accs" stroke-width="2.5"/>
    <line x1="14" y1="64" x2="36" y2="64" class="accs" stroke-width="2.5"/>
    <text x="25" y="86" text-anchor="middle" class="lbl ink">Microphone</text>
  </g>
  <!-- animated sound bars -->
  <g transform="translate(132,135)">
    <rect class="bar" x="0"  y="-14" width="5" height="28" rx="2.5" style="animation-delay:0s"/>
    <rect class="bar" x="11" y="-20" width="5" height="40" rx="2.5" style="animation-delay:.25s"/>
    <rect class="bar" x="22" y="-10" width="5" height="20" rx="2.5" style="animation-delay:.5s"/>
    <rect class="bar" x="33" y="-18" width="5" height="36" rx="2.5" style="animation-delay:.15s"/>
    <rect class="bar" x="44" y="-12" width="5" height="24" rx="2.5" style="animation-delay:.4s"/>
  </g>
  <circle class="indot acc" cx="202" cy="150" r="5"/>

  <!-- Stage 2: Whisper on local CPU -->
  <g>
    <rect x="330" y="105" width="150" height="90" rx="14" fill="var(--panel)" stroke="var(--panelln)" stroke-width="1.5"/>
    <rect class="chipglow" x="330" y="105" width="150" height="90" rx="14" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <g class="accs" stroke-width="2">
      <line x1="330" y1="128" x2="320" y2="128"/><line x1="330" y1="150" x2="320" y2="150"/><line x1="330" y1="172" x2="320" y2="172"/>
      <line x1="480" y1="128" x2="490" y2="128"/><line x1="480" y1="150" x2="490" y2="150"/><line x1="480" y1="172" x2="490" y2="172"/>
    </g>
    <text x="405" y="146" text-anchor="middle" class="lbl ink">Whisper</text>
    <text x="405" y="166" text-anchor="middle" class="sub muted">local CPU · offline</text>
  </g>
  <circle class="outdot acc" cx="482" cy="150" r="5"/>

  <!-- Stage 3: active window with typed text -->
  <g>
    <rect x="620" y="104" width="160" height="92" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <line x1="620" y1="124" x2="780" y2="124" class="ln"/>
    <circle cx="632" cy="114" r="3" class="acc"/><circle cx="644" cy="114" r="3" class="muted" fill="currentColor"/>
    <g class="typed"><text x="634" y="158" class="lbl ink">merhaba</text></g>
    <rect class="caret acc" x="634" y="146" width="2" height="16"/>
    <text x="700" y="186" text-anchor="middle" class="sub muted">active window</text>
  </g>

  <!-- blocked internet -->
  <g transform="translate(405,0)">
    <line x1="0" y1="200" x2="0" y2="244" class="accs" stroke-width="2" stroke-dasharray="4 5"/>
    <circle class="blockdot acc" cx="0" cy="238" r="4.5"/>
    <g transform="translate(0,268)">
      <path d="M-26 8 a15 15 0 0 1 4 -29 a19 19 0 0 1 36 4 a13 13 0 0 1 2 25 Z"
            fill="none" stroke="var(--line)" stroke-width="2"/>
      <g class="xmark" stroke="var(--accent)" stroke-width="3" stroke-linecap="round">
        <line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/>
      </g>
    </g>
    <text x="0" y="300" text-anchor="middle" class="sub muted">no data leaves</text>
  </g>
</svg>
